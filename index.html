<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AR Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>AR Training</title>
<style>
:root{color-scheme:dark;--bg:#050505;--card:#0f1012;--card2:#17181b;--line:#25272b;--txt:#f2f2f3;--mut:#8a8d93;--acc:#ff1f2d;--acc2:#d11420;--top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{margin:0;color:var(--txt);font:16px/1.4 -apple-system,system-ui,sans-serif;padding-top:var(--top);padding-bottom:calc(150px + var(--bot));-webkit-user-select:none;user-select:none;overscroll-behavior-y:none}
input,textarea{-webkit-user-select:text;user-select:text}
main{max-width:640px;margin:0 auto;padding:12px 16px}
h1{font-size:21px;margin:6px 0 12px;letter-spacing:.02em;text-transform:uppercase}
h2{font-size:17px;margin:0 0 6px}
h3{font-size:13px;margin:12px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.card.ss{border-left:3px solid var(--acc)}
.mut{color:var(--mut);font-size:13px}
.acc{color:var(--acc)}.b{font-weight:700}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-height:44px;cursor:pointer;touch-action:manipulation}
button:active{background:#222428}
button:disabled{opacity:.3}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
button.p:active{background:var(--acc2)}
button.d{color:var(--mut)}button.d:active{color:var(--acc);border-color:var(--acc)}
button.ic{min-width:44px;padding:0 10px}
button.lnk{background:none;border:0;padding:0 4px;min-height:32px;color:var(--acc)}
button.blk{width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}.nw{flex-wrap:nowrap}
.grow{flex:1;min-width:0}
input,select,textarea{background:#000;border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
select{-webkit-appearance:none;appearance:none;text-align:center;text-align-last:center}
input::placeholder{color:#5d6066}
.set{display:grid;grid-template-columns:36px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 52px 46px;gap:5px;align-items:center;margin-top:6px;border-radius:10px}
.set>*{min-height:44px}
.set input,.set select{padding:8px 4px;text-align:center}
.set .prev{font-size:13px;color:var(--mut);background:none;border:0;padding:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set .lab{padding:0;font-weight:700;font-size:14px}
.set .lab.w{color:#f5a524}.set .lab.f{color:var(--acc)}.set .lab.d{color:#7c8cff}
.set.done{background:#ff1f2d16}
.set.done input,.set.done select{border-color:#ff1f2d66}
.set .ok{padding:0}.set.done .ok{background:var(--acc);border-color:var(--acc);color:#fff}
.set.hd{min-height:0;margin-top:8px}.set.hd>*{min-height:0;font-size:11px;color:var(--mut);text-align:center;text-transform:uppercase;letter-spacing:.04em}
.prb{display:inline-block;background:var(--acc);color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:4px;vertical-align:middle}
.goal{font-size:13px;margin-top:4px}.goal b{color:var(--txt)}
.note{font-size:13px;background:#000;border-left:3px solid #f5a524;padding:6px 8px;border-radius:6px;margin-top:6px;white-space:pre-wrap}
nav{position:fixed;bottom:0;left:0;right:0;background:#0b0b0cf2;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--bot);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:8px 2px 10px;font-size:11px;color:var(--mut);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--acc);font-weight:700}
#rest{position:fixed;left:8px;right:8px;bottom:calc(62px + var(--bot));background:var(--acc);color:#fff;display:none;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:14px;font-weight:800;box-shadow:0 8px 30px #ff1f2d55;z-index:6}
#rest .t{font-size:24px;font-variant-numeric:tabular-nums;flex:1}
#rest button{background:#0004;border:0;color:#fff;min-width:56px}
#rest .pg{position:absolute;left:0;bottom:0;height:3px;background:#fff;border-radius:0 0 0 14px}
#flash{position:fixed;inset:0;background:var(--acc);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:20;font-size:34px;font-weight:900;text-align:center;letter-spacing:.04em}
#flash.on{display:flex;animation:fl .5s ease-in-out 4 alternate}
@keyframes fl{from{background:var(--acc)}to{background:#5a0006}}
#sheet{position:fixed;inset:0;z-index:15;display:none}
#sheet.on{display:block}
#sheet .bg{position:absolute;inset:0;background:#000b}
#sheet .sh{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow:auto;background:var(--card2);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(16px + var(--bot));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sh .grab{width:40px;height:5px;background:#3a3c41;border-radius:3px;margin:-6px auto 12px}
.cat{font-size:11px;color:var(--acc);font-weight:800;margin:10px 0 0;text-transform:uppercase;letter-spacing:.08em}
.list h3{margin-top:18px}
.list button{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin-top:6px;background:var(--card)}
#toast{position:fixed;left:50%;top:calc(12px + var(--top));transform:translate(-50%,-150%);opacity:0;pointer-events:none;background:var(--acc);color:#fff;font-weight:700;padding:10px 16px;border-radius:12px;z-index:30;transition:transform .25s;max-width:92vw;text-align:center;box-shadow:0 8px 24px #ff1f2d55}
#toast.on{transform:translate(-50%,0);opacity:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;min-height:36px;padding:6px 12px;font-size:14px;border-radius:18px}
.chips button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bar{position:relative;height:10px;border-radius:5px;background:#000;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--acc)}
.bar s{position:absolute;top:0;bottom:0;background:#ffffff14}
svg{width:100%;height:auto;display:block}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi div{background:#000;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.kpi b{display:block;font-size:22px}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cal i{display:block;aspect-ratio:1;border-radius:3px;background:#16171a}
.cal i.on{background:var(--acc)}.cal i.fu{background:transparent}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mut);font-weight:600;font-size:12px}
.banner{border:1px solid var(--acc);background:#ff1f2d12}
label.f{display:block;font-size:13px;color:var(--mut);margin-top:8px}
label.f input,label.f select,label.f textarea{margin-top:4px;color:var(--txt)}
.ck{display:flex;gap:10px;align-items:center;min-height:44px}
.ck input{width:22px;height:22px;min-height:0;accent-color:var(--acc)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.timer{font-variant-numeric:tabular-nums;color:var(--mut);font-size:14px}
.plates{display:flex;gap:3px;align-items:center;justify-content:center;margin:14px 0}
.plates span{background:var(--acc);color:#fff;border-radius:4px;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;width:26px}
</style>
</head>
<body>
<main id="app"></main>
<div id="rest"><span class="t" id="rt">0:00</span><button data-act="rest-">−15</button><button data-act="rest+">+15</button><button data-act="rest-stop">Passer</button><i class="pg" id="rpg"></i></div>
<div id="flash" data-act="flash-off">REPOS<br>TERMINÉ<div style="font-size:15px;font-weight:600;margin-top:16px">Touche pour continuer</div></div>
<div id="sheet"></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script src="app.js"></script>
</body>
</html>
